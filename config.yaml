bind_addr: "127.0.0.1"   # root PS (localhost for single-machine testing)
base_port: 5550

sync: false

eval:
  host: "127.0.0.1"
  port: 5560
  accuracy_threshold: 0.90
  time_limit_s: 3600

training:
  learning_rate: 0.01
  batch_size: 32
  n_epochs: 1
  eval_interval: 200
  local_steps: 1

workers:
  - hostname: localhost
    cpu: 100
  - hostname: localhost
    cpu: 100
