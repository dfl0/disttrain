# host specifies the SSH destination
# CPU and bandwidth limits are not supported
mode: async
nodes:
  - id: root
    role: root_ps
    host: 192.168.1.1
    endpoint: tcp://192.168.1.1:5550
    bind_endpoint: tcp://*:5550
    stop_endpoint: tcp://192.168.1.1:5551
    stop_bind_endpoint: tcp://*:5551
    mode: sync
  - id: edge-a
    role: edge_ps
    host: 192.168.1.2
    endpoint: tcp://192.168.1.2:5550
    bind_endpoint: tcp://*:5550
    parent: root
  - id: edge-b
    role: edge_ps
    host: 192.168.1.3
    endpoint: tcp://192.168.1.3:5550
    bind_endpoint: tcp://*:5550
    parent: root
  - id: evaluator
    role: eval
    host: 192.168.1.5
    endpoint: tcp://192.168.1.5:5560
    bind_endpoint: tcp://*:5560
  - id: worker-1
    role: worker
    host: pi-worker-1
    parent: edge-a
  - id: worker-2
    role: worker
    host: pi-worker-2
    parent: edge-a
  - id: worker-3
    role: worker
    host: pi-worker-3
    parent: edge-b
  - id: worker-4
    role: worker
    host: pi-worker-4
    parent: edge-b
training:
  learning_rate: 0.01
  batch_size: 32
  n_epochs: 1
  eval_interval: 200
  local_steps: 1
eval:
  accuracy_threshold: 0.90
  time_limit_s: 3600
