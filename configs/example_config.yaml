bind_addr: "192.168.1.1"   # root PS address
base_port: 5550             # root PS binds on this port; base_port+1 used for STOP (from evaluator)

sync: false

eval:
  host: "192.168.1.5"
  port: 5560
  accuracy_threshold: 0.90
  time_limit_s: 3600

training:
  learning_rate: 0.01
  batch_size: 32
  n_epochs: 1
  eval_interval: 200
  local_steps: 1    # micro-steps per PS sync; >1 reduces communication frequency

edge_servers:
  - sync: true
    bind_addr: "192.168.1.2"
    workers:
      - hostname: pi-worker-1
        cpu: 100
      - hostname: pi-worker-2
        cpu: 100

  - sync: true
    bind_addr: "192.168.1.3"
    workers:
      - hostname: pi-worker-3
        cpu: 30
        bw: 10mbit
      - hostname: pi-worker-4
        cpu: 30
        bw: 10mbit
